global:
  scrape_interval: 15s
  evaluation_interval: 15s

# alert_rules.yml is still loaded so its rules evaluate and show up on Prometheus's own
# /alerts page — there's no Alertmanager deployed on Railway (scope was Prometheus + Grafana
# only), so nothing routes/delivers these firing alerts anywhere yet. See docs/RUNBOOK.md and
# the README's Known Risks for the honest state of alerting.
rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  # The LiveKit worker's own exporter (see AgentServer(prometheus_port=..., ...) in
  # app/worker.py). Only `up` (scrape health/liveness) is confirmed working here — the
  # lk_agents_worker_load/active_job_count/proc_initialize_duration_seconds metrics are
  # correctly defined in the SDK with proper multiprocess wiring, but verified NOT to
  # populate in this deployment even for events we know fired (see README's Known Risks).
  # worker.railway.internal is Railway's private-networking hostname for the `worker` service.
  - job_name: worker
    static_configs:
      - targets: ["worker.railway.internal:9091"]

  # prometheus-fastapi-instrumentator (app/web.py) exposes http_requests_total,
  # http_request_duration_seconds, by handler/method/status — confirmed producing real
  # content (unlike the worker's lk_agents_* metrics, see README's Known Risks).
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api.railway.internal:8000"]

  # node-exporter, postgres-exporter, and pushgateway aren't deployed on Railway (no
  # host-level access for the first two on a PaaS, and no backup loop pushing to the third
  # yet) — the corresponding dashboard panels will read "No data" until/unless those exist.
