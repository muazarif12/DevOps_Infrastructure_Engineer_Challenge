apiVersion: 1

datasources:
  # prometheus.railway.internal is Railway's private-networking hostname for the `prometheus`
  # service. No Loki datasource: not deployed on Railway (scope was Prometheus + Grafana only).
  - name: Prometheus
    type: prometheus
    uid: prometheus_ds
    access: proxy
    url: http://prometheus.railway.internal:9090
    isDefault: true
    editable: false
