# Single-host operational stack for the patient intake voice agent.
#
# `docker compose up -d --build` brings up everything needed to answer real calls:
# worker + api + postgres + caddy now; prometheus/alertmanager/grafana/loki/backups are
# appended below this section. Secrets come from `.env` (copy `.env.example`) — never
# committed, already in .gitignore.
#
# The worker needs NO published port to function: it dials LiveKit Cloud outbound over
# WSS and receives call dispatches on that same connection. Its :8081 (health) and :9091
# (prometheus) ports below are for operator/monitoring access only, not the phone path.

name: patient-intake-voice

networks:
  backend: {} # app <-> postgres, and app <-> observability scrape targets
  edge: {} # caddy <-> the services it fronts

volumes:
  postgres_data: {}
  caddy_data: {}
  caddy_config: {}
  prometheus_data: {}
  alertmanager_data: {}
  grafana_data: {}
  loki_data: {}
  minio_data: {}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-intake}
      POSTGRES_USER: ${POSTGRES_USER:-intake}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-intake} -d ${POSTGRES_DB:-intake}"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LIVEKIT_URL: ${LIVEKIT_URL:?set LIVEKIT_URL in .env}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY in .env}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET in .env}
      LIVEKIT_LOG_LEVEL: ${LIVEKIT_LOG_LEVEL:-INFO}
      INTAKE_DB_URL: postgresql+psycopg://${POSTGRES_USER:-intake}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-intake}
    networks: [backend]
    healthcheck:
      test:
        [
          "CMD",
          "/app/.venv/bin/python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8081/', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s # first-run model init can take ~60-90s; see Dockerfile

  api:
    build: .
    command: ["uv", "run", "uvicorn", "app.web:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      INTAKE_DB_URL: postgresql+psycopg://${POSTGRES_USER:-intake}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-intake}
      API_KEY: ${API_KEY:?set API_KEY in .env}
    networks: [backend, edge]
    healthcheck:
      test:
        [
          "CMD",
          "/app/.venv/bin/python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]
    networks: [edge]

  # --- Observability -----------------------------------------------------------------------

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    networks: [backend]
    ports:
      - "127.0.0.1:9090:9090" # operator-only: not routed through Caddy, see infra/caddy/Caddyfile

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    volumes:
      - ./infra/observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    networks: [backend]
    ports:
      - "127.0.0.1:9093:9093"

  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    networks: [backend]

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-intake}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-intake}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]

  pushgateway:
    image: prom/pushgateway:v1.9.0
    restart: unless-stopped
    networks: [backend]

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus, loki]
    networks: [backend]
    ports:
      - "127.0.0.1:3000:3000" # operator-only, like Prometheus/Alertmanager/MinIO — not
      # routed through Caddy: combining Grafana's sub-path serving with Caddy's
      # automatic-HTTPS-for-"localhost" behavior (self-signed cert, redirect semantics) was
      # exactly the kind of interaction this build couldn't verify without Docker available,
      # so it's a direct port instead of an untested reverse-proxy path.

  loki:
    image: grafana/loki:3.1.1
    restart: unless-stopped
    volumes:
      - ./infra/observability/loki.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: ["-config.file=/etc/loki/local-config.yaml"]
    networks: [backend]

  promtail:
    image: grafana/promtail:3.1.1
    restart: unless-stopped
    volumes:
      - ./infra/observability/promtail.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: ["-config.file=/etc/promtail/config.yml"]
    depends_on: [loki]
    networks: [backend]

  # --- Backups -------------------------------------------------------------------------------
  #
  # minio/minio-init are gated behind the "local-s3" profile: they stand in for a real S3 bucket
  # only until cloud credentials exist. Locally / for this review: `docker compose --profile
  # local-s3 up -d --build`. On the AWS deployment in infra/terraform/ (a real S3 bucket + an
  # IAM instance role that can read/write it), leave the profile off entirely and drop
  # AWS_ENDPOINT_URL / the static AWS_* keys from .env — scripts/backup.sh and restore.sh don't
  # change at all; boto3 just falls back to the instance role against real S3.

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    profiles: ["local-s3"]
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - minio_data:/data
    command: ["server", "/data"]
    networks: [backend]
    ports:
      - "127.0.0.1:9000:9000" # operator-only: console/API access for restore drills
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5

  # One-shot: makes sure BACKUP_BUCKET exists in MinIO before backup.sh's first run. A real S3
  # bucket would be created by Terraform instead (see infra/terraform/) — this is MinIO-only
  # bootstrapping.
  minio-init:
    image: minio/mc:RELEASE.2024-10-13T09-58-11Z
    profiles: ["local-s3"]
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    networks: [backend]
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
        mc mb --ignore-existing local/$${BACKUP_BUCKET}
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      BACKUP_BUCKET: ${BACKUP_BUCKET:-intake-backups}

  backup:
    build:
      context: .
      dockerfile: infra/backup/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      # Deliberately NOT depending on minio-init: that service only exists under the
      # local-s3 profile, and a hard dependency on a profile-gated service breaks `docker
      # compose up` whenever that profile isn't active (e.g. the real AWS deployment). See
      # s3_object.py's _ensure_bucket() for the self-healing replacement.
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-intake}
      POSTGRES_USER: ${POSTGRES_USER:-intake}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      BACKUP_BUCKET: ${BACKUP_BUCKET:-intake-backups}
      PUSHGATEWAY_URL: http://pushgateway:9091
      # These three are intentionally optional (not `:?`-required), not tied to
      # MINIO_ROOT_USER/PASSWORD: for local review, set them in .env to the same values you
      # gave MinIO (see .env.example). For the real AWS deployment, leave all three unset —
      # boto3 then falls back to the EC2 instance role Terraform grants S3 access via, and
      # AWS_ENDPOINT_URL unset means "talk to real AWS", not MinIO.
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-900} # 15 min
    networks: [backend]
    # A real deployment would use a systemd timer / cron / cloud-scheduled job instead of a
    # long-running loop (see README's Next Steps) — this is the "make it observable and testable
    # within a 2-hour Compose stack" version of the same idea.
    entrypoint: >
      /bin/bash -c "
        while true; do
          ./backup.sh || echo '[backup] run failed, will retry next interval' >&2;
          sleep $${BACKUP_INTERVAL_SECONDS};
        done
      "
