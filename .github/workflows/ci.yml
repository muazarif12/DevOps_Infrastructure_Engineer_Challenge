name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.31"
          # Pinned to match the Dockerfile's runtime (ARG PYTHON_VERSION=3.13) rather than
          # whatever happens to be on the runner — the local dev venv drifting to 3.14 is what
          # let a real test-collection failure (unrelated to the version itself, as it turned
          # out — see README trade-offs) go unnoticed until it was investigated by hand.
          python-version: "3.13"

      - name: Sync dependencies
        run: uv sync --locked --all-groups

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Test (pytest)
        run: uv run python -m pytest -q

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push — no registry configured for this exercise)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: patient-intake-voice:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
